<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ask bubsier</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;

      width: 100%;
      min-height: 100%;

      background: white;
      color: black;

      font-family: monospace;
      text-transform: lowercase;
    }

    body {
      overflow: hidden;
    }

    button,
    input {
      font-family: monospace;
      text-transform: lowercase;
    }


    /* =========================
       menu
       ========================= */

    .side-menu {
      position: fixed;

      top: 0;
      left: 0;

      width: 245px;
      height: 100vh;

      padding: 20px 18px;

      background: white;

      border-right: 5px solid black;

      z-index: 100;

      display: flex;
      flex-direction: column;
    }

    .menu-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .menu-title {
      margin: 0 0 24px;

      font-size: 44px;
      font-weight: normal;
    }

    .menu-toggle {
      display: none;

      width: 44px;
      height: 44px;

      padding: 0;

      border: 4px solid black;

      background: white;
      color: black;

      font-size: 24px;

      cursor: pointer;
    }

    .menu-toggle:hover {
      background: black;
      color: white;
    }

    .menu-links {
      flex: 1;

      display: flex;
      flex-direction: column;

      gap: 18px;
    }

    .menu-link {
      width: 100%;
      min-height: 67px;

      padding: 10px;

      border: 4px solid black;

      background: white;
      color: black;

      text-decoration: none;

      display: flex;
      align-items: center;
      justify-content: center;

      text-align: center;

      font-size: 18px;
    }

    .menu-link:hover,
    .menu-link.active {
      background: black;
      color: white;
    }

    .contact-menu-link {
      margin-top: auto;
    }


    /* =========================
       page
       ========================= */

    .content {
      position: relative;

      margin-left: 245px;

      width: calc(100% - 245px);
      height: 100vh;

      overflow: hidden;

      background: white;
    }


    /* =========================
       ask area
       ========================= */

    .ask-area {
      position: absolute;

      left: 7%;
      top: 8%;

      width: 40%;

      z-index: 30;
    }

    .ask-title {
      margin: 0;

      font-size: clamp(60px, 6vw, 96px);

      line-height: 0.88;
      letter-spacing: -3px;
    }

    .ask-subtitle {
      margin: 16px 0 26px;

      font-size: clamp(14px, 1.3vw, 19px);

      line-height: 1.4;
    }

    .ask-form {
      width: 100%;

      display: flex;
      flex-direction: column;

      gap: 14px;
    }

    .ask-input {
      width: 100%;

      min-height: 66px;

      padding: 16px 18px;

      border: 4px solid black;

      background: white;
      color: black;

      outline: none;

      font-size: 16px;
    }

    .ask-input::placeholder {
      color: #666;
    }

    .ask-button {
      width: 100%;

      min-height: 56px;

      border: 4px solid black;

      background: white;
      color: black;

      font-size: 18px;

      cursor: pointer;
    }

    .ask-button:hover {
      background: black;
      color: white;
    }


    /* =========================
       character stage
       ========================= */

    .character-stage {
      position: absolute;

      right: 2%;
      bottom: 3%;

      width: 850px;
      height: 600px;

      z-index: 5;
    }


    /* =========================
       figure
       ========================= */

    .huge-figure {
      position: absolute;

      right: 0;
      bottom: 0;

      width: 430px;
      height: 560px;

      z-index: 2;

      pointer-events: none;
    }

    .huge-figure img {
      display: block;

      width: 100%;
      height: 100%;

      object-fit: contain;
      object-position: center bottom;
    }


    /* =========================
       speech bubble
       ========================= */

    .speech-bubble {
      position: absolute;

      left: 30px;
      top: 205px;

      width: 370px;
      min-height: 150px;

      padding: 22px 26px;

      border: 4px solid black;

      border-radius: 26px;

      background: white;

      z-index: 10;

      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .bubble-meta {
      margin-bottom: 10px;

      font-size: 11px;
    }

    .bubble-answer {
      font-size: clamp(22px, 2.2vw, 32px);

      line-height: 1.15;
    }

    .bubble-answer.small {
      font-size: clamp(16px, 1.7vw, 22px);

      line-height: 1.3;
    }


    /* =========================
       triangle tail
       right side, low
       ========================= */

    .speech-bubble::after {
      content: "";

      position: absolute;

      right: -32px;
      bottom: 18px;

      width: 0;
      height: 0;

      border-top: 18px solid transparent;
      border-bottom: 18px solid transparent;
      border-left: 32px solid black;
    }

    .speech-bubble::before {
      content: "";

      position: absolute;

      right: -23px;
      bottom: 23px;

      width: 0;
      height: 0;

      border-top: 13px solid transparent;
      border-bottom: 13px solid transparent;
      border-left: 23px solid white;

      z-index: 2;
    }


    /* =========================
       footer
       ========================= */

    .corner-footer {
      position: absolute;

      left: 28px;
      right: 22px;
      bottom: 18px;

      height: 175px;

      z-index: 50;

      pointer-events: none;
    }

    .est {
      position: absolute;

      left: 0;
      bottom: 0;

      font-size: 12px;
      letter-spacing: 1px;
    }


    /* =========================
       mobile
       ========================= */

    @media (max-width: 950px) {

      body {
        overflow-x: hidden;
        overflow-y: auto;
      }

      .side-menu {
        position: relative;

        width: 100%;
        height: auto;

        padding: 14px 18px;

        border-right: none;
        border-bottom: 5px solid black;
      }

      .menu-title {
        margin: 0;

        font-size: 32px;
      }

      .menu-toggle {
        display: block;
      }

      .menu-links {
        display: none;

        flex: none;

        margin-top: 15px;
      }

      .side-menu.open .menu-links {
        display: grid;

        grid-template-columns: 1fr 1fr;

        gap: 10px;
      }

      .menu-link {
        min-height: 58px;

        font-size: 15px;
      }

      .contact-menu-link {
        margin-top: 0;
      }


      .content {
        margin-left: 0;

        width: 100%;
        height: auto;

        min-height: 100vh;

        padding: 34px 18px 24px;

        overflow: hidden;
      }


      .ask-area {
        position: relative;

        left: auto;
        top: auto;

        width: 100%;
      }


      .ask-title {
        font-size: clamp(52px, 16vw, 82px);
      }


      .ask-subtitle {
        margin-bottom: 22px;

        font-size: 14px;
      }


      .character-stage {
        position: relative;

        right: auto;
        bottom: auto;

        width: 100%;
        height: 500px;

        margin-top: 30px;
      }


      .huge-figure {
        right: 0;
        bottom: 0;

        width: 285px;
        height: 420px;
      }


      .speech-bubble {
        left: 0;
        top: 185px;

        width: calc(100% - 295px);

        min-height: 135px;

        padding: 18px;

        border-radius: 20px;
      }


      /* right-side low triangle */

      .speech-bubble::after {
        right: -26px;
        bottom: 16px;

        border-top: 14px solid transparent;
        border-bottom: 14px solid transparent;
        border-left: 26px solid black;
      }

      .speech-bubble::before {
        right: -19px;
        bottom: 20px;

        border-top: 10px solid transparent;
        border-bottom: 10px solid transparent;
        border-left: 19px solid white;
      }


      .bubble-meta {
        margin-bottom: 8px;

        font-size: 10px;
      }


      .bubble-answer {
        font-size: clamp(18px, 4.8vw, 25px);
      }


      .bubble-answer.small {
        font-size: clamp(14px, 3.8vw, 19px);
      }


      .corner-footer {
        position: relative;

        left: auto;
        right: auto;
        bottom: auto;

        width: 100%;
        height: auto;

        margin-top: 18px;
      }

      .est {
        position: relative;

        left: auto;
        bottom: auto;
      }

    }


    /* =========================
       small phones
       ========================= */

    @media (max-width: 560px) {

      .side-menu.open .menu-links {
        grid-template-columns: 1fr;
      }

      .content {
        padding: 30px 18px 24px;
      }

      .character-stage {
        height: 460px;

        margin-top: 22px;
      }

      .huge-figure {
        width: 245px;
        height: 380px;
      }

      .speech-bubble {
        top: 175px;

        width: calc(100% - 255px);

        min-height: 120px;

        padding: 15px 14px;
      }


      /* smaller right-side tail */

      .speech-bubble::after {
        right: -22px;
        bottom: 14px;

        border-top: 12px solid transparent;
        border-bottom: 12px solid transparent;
        border-left: 22px solid black;
      }

      .speech-bubble::before {
        right: -16px;
        bottom: 17px;

        border-top: 8px solid transparent;
        border-bottom: 8px solid transparent;
        border-left: 16px solid white;
      }


      .bubble-meta {
        font-size: 9px;
      }

      .bubble-answer {
        font-size: clamp(15px, 4.3vw, 20px);
      }

    }

  </style>

</head>


<body>

  <aside
    class="side-menu"
    id="sideMenu"
  >

    <div class="menu-header">

      <h1 class="menu-title">
        menu
      </h1>

      <button
        class="menu-toggle"
        id="menuToggle"
        onclick="toggleMenu()"
        aria-expanded="false"
      >
        +
      </button>

    </div>


    <nav class="menu-links">

      <a href="index.html" class="menu-link">
        home
      </a>

      <a href="about.html" class="menu-link">
        about me
      </a>

      <a href="bubfm.html" class="menu-link">
        bubfm
      </a>

      <a
        href="askbubsier.html"
        class="menu-link active"
      >
        ask bubsier
      </a>

      <a
        href="mailto:bubsier04@gmail.com"
        class="menu-link contact-menu-link"
      >
        contact me
      </a>

    </nav>

  </aside>


  <main class="content">

    <section class="ask-area">

      <h1 class="ask-title">
        ask bubsier
      </h1>

      <p class="ask-subtitle">
        need advice? ask and you will receive
      </p>

      <div class="ask-form">

        <input
          type="text"
          id="questionInput"
          class="ask-input"
          placeholder="ask me anything..."
          autocomplete="off"
        >

        <button
          class="ask-button"
          onclick="askBubsier()"
        >
          ask
        </button>

      </div>

    </section>


    <section class="character-stage">

      <div class="huge-figure">

        <img
          src="Figure.JPG"
          alt=""
        >

      </div>


      <div class="speech-bubble">

        <div
          class="bubble-meta"
          id="bubbleMeta"
        >
          awaiting inquiry...
        </div>

        <div
          class="bubble-answer small"
          id="bubbleAnswer"
        >
          
        </div>

      </div>

    </section>


    <div class="corner-footer">

      <div class="est">
        est. 2025
      </div>

    </div>

  </main>


  <script>

    const sideMenu =
      document.getElementById("sideMenu");

    const menuToggle =
      document.getElementById("menuToggle");

    const questionInput =
      document.getElementById("questionInput");

    const bubbleMeta =
      document.getElementById("bubbleMeta");

    const bubbleAnswer =
      document.getElementById("bubbleAnswer");


    const answers = [
      "absolutely.",
      "absolutely not.",
      "yes.",
      "no.",
      "probably.",
      "probably not.",
      "do it.",
      "don't do it.",
      "the vibe says yes.",
      "the vibe says no.",
      "ask me again later.",
      "you already know the answer.",
      "i fear this is the move.",
      "respectfully, no.",
      "proceed with caution.",
      "full send.",
      "sleep on it.",
      "send the text.",
      "do not send the text.",
      "this feels suspicious.",
      "yes, unfortunately.",
      "no, fortunately.",
      "odds are in your favor.",
      "the vibes are concerning.",
      "book the flight.",
      "go dancing instead.",
      "ask again after the club."
    ];


    function toggleMenu() {

      sideMenu.classList.toggle("open");

      const open =
        sideMenu.classList.contains("open");

      menuToggle.textContent =
        open ? "−" : "+";

      menuToggle.setAttribute(
        "aria-expanded",
        open
      );

    }


    function askBubsier() {

      const question =
        questionInput.value.trim();


      if (question === "") {

        bubbleMeta.textContent =
          "no inquiry detected.";

        bubbleAnswer.textContent =
          "you have to ask something first.";

        bubbleAnswer.classList.add("small");

        return;

      }


      bubbleMeta.textContent =
        "bubsier says...";

      bubbleAnswer.textContent =
        "...";


      setTimeout(
        function() {

          const randomAnswer =
            answers[
              Math.floor(
                Math.random() *
                answers.length
              )
            ];

          bubbleAnswer.textContent =
            randomAnswer;


          if (randomAnswer.length > 30) {
            bubbleAnswer.classList.add("small");
          } else {
            bubbleAnswer.classList.remove("small");
          }

        },
        450
      );

    }


    questionInput.addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Enter") {

          event.preventDefault();

          askBubsier();

        }

      }
    );

  </script>

</body>

</html>
