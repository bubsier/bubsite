<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>the bubsite</title>

  <style>

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      background: black;
      font-family: monospace;
    }


    /* =========================
       MAIN PAGE
       ========================= */

    .page {
      width: 100%;
      height: 100vh;
      box-sizing: border-box;
      padding: 18px 5vw 18px;

      display: flex;
      flex-direction: column;

      overflow: hidden;

      background: white;

      opacity: 0.08;
      filter: brightness(0.12);

      transition:
        opacity 1.8s ease,
        filter 2.2s ease;
    }


    body.site-on .page {
      animation: pagePowerOn 5.5s ease forwards;
    }


    @keyframes pagePowerOn {

      0% {
        opacity: 0.08;
        filter: brightness(0.10);
      }

      18% {
        opacity: 0.13;
        filter: brightness(0.15);
      }

      30% {
        opacity: 0.09;
        filter: brightness(0.10);
      }

      45% {
        opacity: 0.30;
        filter: brightness(0.35);
      }

      60% {
        opacity: 0.48;
        filter: brightness(0.52);
      }

      75% {
        opacity: 0.72;
        filter: brightness(0.75);
      }

      100% {
        opacity: 1;
        filter: brightness(1);
      }
    }


    .main-title {
      text-align: center;
      margin: 0 0 15px 0;

      font-size: clamp(34px, 4vw, 58px);
      line-height: 1;

      color: black;

      flex-shrink: 0;
    }


    .main-layout {
      width: 100%;
      max-width: 1300px;

      margin: 0 auto;

      flex: 1;
      min-height: 0;

      display: grid;

      grid-template-columns: 2fr 1fr;

      gap: 40px;
    }



    /* =========================
       LEFT SIDE
       ========================= */

    .left-column {
      min-height: 0;

      display: flex;
      flex-direction: column;

      gap: 15px;
    }



    /* =========================
       CREATE YOUR OWN IMAGE
       ========================= */

    .photo-mixer {
      height: 300px;

      flex-shrink: 0;

      border: 4px solid black;

      box-sizing: border-box;

      background: white;

      display: grid;

      grid-template-rows:
        1fr
        1fr
        1fr;

      overflow: hidden;
    }



    /* =========================
       EACH IMAGE THIRD
       ========================= */

    .mixer-row {
      min-height: 0;

      display: grid;

      grid-template-columns:
        70px
        1fr
        70px;
    }


    .mixer-row + .mixer-row {
      border-top: 4px solid black;
    }



    /* =========================
       ARROW SECTIONS
       ========================= */

    .mixer-arrow-box {
      display: flex;

      align-items: center;
      justify-content: center;

      background: white;
    }


    .mixer-arrow-box:first-child {
      border-right: 4px solid black;
    }


    .mixer-arrow-box:last-child {
      border-left: 4px solid black;
    }


    .mixer-button {
      width: 42px;
      height: 42px;

      padding: 0;

      border: 3px solid black;

      background: white;
      color: black;

      font-family: monospace;
      font-size: 22px;

      display: flex;

      align-items: center;
      justify-content: center;

      cursor: pointer;

      transition:
        background 0.15s ease,
        color 0.15s ease,
        transform 0.15s ease;
    }


    .mixer-button:hover {
      background: black;
      color: white;
    }


    .mixer-button:active {
      transform: scale(0.92);
    }



    /* =========================
       IMAGE AREA
       ========================= */

    .mixer-image-box {
      position: relative;

      min-width: 0;
      min-height: 0;

      overflow: hidden;

      background: white;
    }


    .mixer-image {
      position: absolute;

      left: 0;

      width: 100%;
      height: 300px;

      object-fit: cover;

      user-select: none;
      -webkit-user-select: none;
      -webkit-user-drag: none;

      pointer-events: none;
    }


    /*
       Each image is the entire
       300px-tall photo.

       Each row reveals a different
       third of the image.
    */


    .top-image {
      top: 0;
    }


    .middle-image {
      top: -100px;
    }


    .bottom-image {
      top: -200px;
    }



    /* =========================
       MAP
       ========================= */

    .map-section {
      width: 100%;

      flex: 1;

      min-height: 0;

      display: flex;
      flex-direction: column;
    }


    .map-title {
      margin: 0 0 7px 0;

      text-align: center;

      font-family: monospace;

      font-size: clamp(18px, 2vw, 28px);

      font-weight: normal;

      color: black;

      flex-shrink: 0;
    }


    .map-box {
      width: 100%;

      flex: 1;

      min-height: 0;

      border: 4px solid black;

      box-sizing: border-box;

      background: white;

      display: block;
    }



    /* =========================
       RIGHT SIDE
       ========================= */

    .right-column {
      min-height: 0;

      height: 100%;

      display: flex;

      flex-direction: column;

      gap: 10px;
    }


    .social-link {
      display: block;

      text-decoration: none;

      flex: 1 1 0;

      min-height: 0;
    }


    .social-button {
      width: 100%;
      height: 100%;

      padding: 0 16px;

      border: 4px solid black;

      background: white;

      color: black;

      font-family: monospace;

      font-size: clamp(18px, 1.8vw, 25px);

      cursor: pointer;

      box-sizing: border-box;

      transition: 0.2s;

      display: flex;

      align-items: center;
      justify-content: center;
    }


    .social-button:hover {
      background: black;
      color: white;
    }



    /* =========================
       BUB FM
       ========================= */

    .radio-section {
      width: 100%;

      flex: 0 0 auto;

      display: flex;
      flex-direction: column;
    }


    .radio-title {
      margin: 0 0 7px 0;

      text-align: center;

      font-family: monospace;

      font-size: clamp(18px, 2vw, 28px);

      font-weight: normal;

      color: black;

      flex-shrink: 0;
    }


    .cd-player-frame {
      width: 100%;
      height: 285px;

      border: none;

      box-sizing: border-box;

      margin: 0;

      display: block;

      overflow: hidden;

      background: transparent;

      flex-shrink: 0;
    }



    /* =========================
       WELCOME SCREEN
       ========================= */

    #welcomeScreen {
      position: fixed;

      inset: 0;

      width: 100%;
      height: 100%;

      background: white;

      display: flex;

      flex-direction: column;

      justify-content: center;
      align-items: center;

      text-align: center;

      color: black;

      font-family: monospace;

      z-index: 9999;

      cursor: pointer;

      opacity: 1;

      transition: opacity 1.4s ease;
    }


    #welcomeScreen h1 {
      font-size: clamp(40px, 8vw, 75px);

      margin: 0;
    }


    #welcomeScreen p {
      font-size: clamp(14px, 3vw, 20px);

      margin-top: 15px;
    }



    /* =========================
       BOOT PARTS
       ========================= */

    .boot-part {
      opacity: 0;

      filter: brightness(0);

      pointer-events: none;
    }


    body.site-on .boot-photo {
      animation: flickerPhoto 2s forwards;

      animation-delay: 0.5s;
    }


    body.site-on .boot-twitter {
      animation: flickerQuick 1.35s forwards;

      animation-delay: 0.85s;
    }


    body.site-on .boot-map {
      animation: flickerMap 4.2s forwards;

      animation-delay: 0.9s;
    }


    body.site-on .boot-soundcloud {
      animation: flickerQuick 1.45s forwards;

      animation-delay: 1.05s;
    }


    body.site-on .boot-instagram {
      animation: flickerQuick 1.15s forwards;

      animation-delay: 1.35s;
    }


    body.site-on .boot-radio {
      animation: flickerMedium 2.2s forwards;

      animation-delay: 1.65s;
    }


    body.site-on .boot-letterboxd {
      animation: flickerQuick 1.2s forwards;

      animation-delay: 1.8s;
    }


    body.site-on .boot-depop {
      animation: flickerQuick 1.1s forwards;

      animation-delay: 2.15s;
    }


    body.site-on .boot-title {
      animation: flickerTitle 1.8s forwards;

      animation-delay: 3.7s;
    }



    /* =========================
       PHOTO FLICKER
       ========================= */

    @keyframes flickerPhoto {

      0% {
        opacity: 0;
        filter: brightness(0);
      }

      6% {
        opacity: 0.2;
        filter: brightness(0.18);
      }

      12% {
        opacity: 0;
        filter: brightness(0);
      }

      20% {
        opacity: 0.55;
        filter: brightness(0.5);
      }

      27% {
        opacity: 0.08;
        filter: brightness(0.08);
      }

      38% {
        opacity: 0.8;
        filter: brightness(0.8);
      }

      46% {
        opacity: 0.25;
        filter: brightness(0.25);
      }

      58% {
        opacity: 1;
        filter: brightness(1);
      }

      66% {
        opacity: 0.6;
        filter: brightness(0.6);
      }

      78% {
        opacity: 1;
        filter: brightness(1);
      }

      86% {
        opacity: 0.82;
        filter: brightness(0.82);
      }

      100% {
        opacity: 1;
        filter: brightness(1);
      }
    }



    /* =========================
       QUICK FLICKER
       ========================= */

    @keyframes flickerQuick {

      0% {
        opacity: 0;
        filter: brightness(0);
      }

      9% {
        opacity: 0.65;
        filter: brightness(0.65);
      }

      15% {
        opacity: 0;
        filter: brightness(0);
      }

      27% {
        opacity: 0.25;
        filter: brightness(0.25);
      }

      34% {
        opacity: 0;
        filter: brightness(0);
      }

      53% {
        opacity: 0.9;
        filter: brightness(0.9);
      }

      61% {
        opacity: 0.3;
        filter: brightness(0.3);
      }

      74% {
        opacity: 1;
        filter: brightness(1);
      }

      81% {
        opacity: 0.65;
        filter: brightness(0.7);
      }

      100% {
        opacity: 1;
        filter: brightness(1);
      }
    }



    /* =========================
       MEDIUM FLICKER
       ========================= */

    @keyframes flickerMedium {

      0% {
        opacity: 0;
        filter: brightness(0);
      }

      8% {
        opacity: 0.25;
        filter: brightness(0.2);
      }

      13% {
        opacity: 0;
        filter: brightness(0);
      }

      24% {
        opacity: 0.65;
        filter: brightness(0.6);
      }

      29% {
        opacity: 0.08;
        filter: brightness(0.05);
      }

      43% {
        opacity: 0.85;
        filter: brightness(0.85);
      }

      49% {
        opacity: 0.2;
        filter: brightness(0.2);
      }

      64% {
        opacity: 1;
        filter: brightness(1);
      }

      72% {
        opacity: 0.5;
        filter: brightness(0.55);
      }

      83% {
        opacity: 0.9;
        filter: brightness(0.9);
      }

      100% {
        opacity: 1;
        filter: brightness(1);
      }
    }



    /* =========================
       MAP FLICKER
       ========================= */

    @keyframes flickerMap {

      0% {
        opacity: 0;
        filter: brightness(0);
      }

      7% {
        opacity: 0.1;
        filter: brightness(0.1);
      }

      11% {
        opacity: 0;
        filter: brightness(0);
      }

      20% {
        opacity: 0.35;
        filter: brightness(0.3);
      }

      24% {
        opacity: 0;
        filter: brightness(0);
      }

      34% {
        opacity: 0.55;
        filter: brightness(0.5);
      }

      38% {
        opacity: 0.08;
        filter: brightness(0.08);
      }

      47% {
        opacity: 0.75;
        filter: brightness(0.7);
      }

      51% {
        opacity: 0.18;
        filter: brightness(0.15);
      }

      61% {
        opacity: 0.9;
        filter: brightness(0.9);
      }

      66% {
        opacity: 0.4;
        filter: brightness(0.45);
      }

      75% {
        opacity: 1;
        filter: brightness(1);
      }

      80% {
        opacity: 0.65;
        filter: brightness(0.7);
      }

      88% {
        opacity: 0.95;
        filter: brightness(0.95);
      }

      92% {
        opacity: 0.8;
        filter: brightness(0.8);
      }

      100% {
        opacity: 1;
        filter: brightness(1);
      }
    }



    /* =========================
       TITLE FLICKER
       ========================= */

    @keyframes flickerTitle {

      0% {
        opacity: 0;
        filter: brightness(0);
      }

      15% {
        opacity: 0.8;
        filter: brightness(0.8);
      }

      22% {
        opacity: 0;
        filter: brightness(0);
      }

      39% {
        opacity: 1;
        filter: brightness(1);
      }

      46% {
        opacity: 0.25;
        filter: brightness(0.25);
      }

      63% {
        opacity: 1;
        filter: brightness(1);
      }

      71% {
        opacity: 0.75;
        filter: brightness(0.75);
      }

      100% {
        opacity: 1;
        filter: brightness(1);
      }
    }


    body.boot-complete .boot-part {
      opacity: 1;

      filter: brightness(1);

      pointer-events: auto;
    }



    /* =========================
       TABLET
       ========================= */

    @media (max-width: 1000px) {

      html,
      body {
        height: auto;
        min-height: 100%;

        overflow-x: hidden;
        overflow-y: auto;
      }


      body {
        display: block;
      }


      .page {
        width: 100%;

        height: auto;
        min-height: 100vh;

        padding: 12px;

        overflow: visible;
      }


      .main-title {
        font-size: 34px;

        margin-bottom: 14px;
      }


      .main-layout {
        display: flex;
        flex-direction: column;

        width: 100%;
        max-width: none;

        gap: 14px;
      }


      .left-column,
      .right-column {
        display: contents;
      }


      .photo-mixer {
        order: 1;

        width: 100%;
        height: 300px;

        flex: none;
      }


      .mixer-image {
        height: 300px;
      }


      .top-image {
        top: 0;
      }


      .middle-image {
        top: -100px;
      }


      .bottom-image {
        top: -200px;
      }


      .social-link {
        order: 2;

        width: 100%;

        flex: none;
      }


      .social-button {
        width: 100%;

        height: auto;

        min-height: 72px;

        padding: 14px 10px;

        font-size: 17px;

        border-width: 3px;
      }


      .map-section {
        order: 3;

        width: 100%;

        flex: none;
      }


      .map-title {
        font-size: 18px;

        margin: 5px 0 7px;
      }


      .map-box {
        width: 100%;

        height: 360px;
        min-height: 360px;

        flex: none;

        border-width: 3px;
      }


      .radio-section {
        order: 4;

        width: 100%;

        flex: none;
      }


      .radio-title {
        font-size: 18px;

        margin: 5px 0 7px;
      }


      .cd-player-frame {
        width: 100%;

        height: 285px;

        flex: none;
      }
    }



    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 600px) {

      .main-title {
        font-size: 28px;
      }


      .photo-mixer {
        height: 255px;
      }


      .mixer-row {
        grid-template-columns:

          54px;
      }


      .mixer-button {
        width: 34px;
        height: 34px;

        border-width: 2px;

        font-size: 18px;
      }


      .mixer-image {

      }


      .top-image {

      }


      .middle-image {

      }


      .bottom-image {
        top: -170px;
      }


      .map-box {
        height: 300px;
        min-height: 300px;
      }


      .cd-player-frame {
        height: 285px;
      }
    }

  </style>
</head>



<body>


  <!-- =========================
       WELCOME SCREEN
       ========================= -->

  <div
    id="welcomeScreen"
    onclick="enterSite()"
  >

    <h1>
      welcome to the bubsite
    </h1>

    <img
      src="Figure.JPG"
      alt=""
    >

    <p>
      click to enter
    </p>

  </div>



  <!-- =========================
       MAIN PAGE
       ========================= -->

  <div class="page">


    <h1 class="main-title boot-part boot-title">
      goin abub & beyond
    </h1>


    <div class="main-layout">



      <!-- =========================
           LEFT SIDE
           ========================= -->

      <div class="left-column">



        <!-- =========================
             CREATE YOUR OWN IMAGE
             ========================= -->

        <div class="photo-mixer boot-part boot-photo">



          <!-- TOP THIRD -->

          <div class="mixer-row">


            <div class="mixer-arrow-box">

              <button
                class="mixer-button"
                onclick="changeSlice('top', -1)"
                aria-label="Previous top image"
              >
                &lt;
              </button>

            </div>



            <div class="mixer-image-box">

              <img
                id="topImage"
                class="mixer-image top-image"
                src="picasso.jpeg"
                alt=""
                draggable="false"
              >

            </div>



            <div class="mixer-arrow-box">

              <button
                class="mixer-button"
                onclick="changeSlice('top', 1)"
                aria-label="Next top image"
              >
                &gt;
              </button>

            </div>

          </div>



          <!-- MIDDLE THIRD -->

          <div class="mixer-row">


            <div class="mixer-arrow-box">

              <button
                class="mixer-button"
                onclick="changeSlice('middle', -1)"
                aria-label="Previous middle image"
              >
                &lt;
              </button>

            </div>



            <div class="mixer-image-box">

              <img
                id="middleImage"
                class="mixer-image middle-image"
                src="picasso.jpeg"
                alt=""
                draggable="false"
              >

            </div>



            <div class="mixer-arrow-box">

              <button
                class="mixer-button"
                onclick="changeSlice('middle', 1)"
                aria-label="Next middle image"
              >
                &gt;
              </button>

            </div>

          </div>



          <!-- BOTTOM THIRD -->

          <div class="mixer-row">


            <div class="mixer-arrow-box">

              <button
                class="mixer-button"
                onclick="changeSlice('bottom', -1)"
                aria-label="Previous bottom image"
              >
                &lt;
              </button>

            </div>



            <div class="mixer-image-box">

              <img
                id="bottomImage"
                class="mixer-image bottom-image"
                src="picasso.jpeg"
                alt=""
                draggable="false"
              >

            </div>



            <div class="mixer-arrow-box">

              <button
                class="mixer-button"
                onclick="changeSlice('bottom', 1)"
                aria-label="Next bottom image"
              >
                &gt;
              </button>

            </div>


          </div>

        </div>



        <!-- =========================

             ========================= -->

        <div class="map-section boot-part boot-map">

          <h2 class="map-title">

      <!-- =========================

          <button class="social-button">
            instagram
          </button>

        </a>



        <a

          class="social-link boot-part boot-twitter"

          <button class="social-button">

        <a

        <a

          <h2 class="radio-title">
            bub fm

  <script>


    /* =========================
       CREATE YOUR OWN IMAGE
       ========================= */

    const mixerPhotos = [
      "picasso.jpeg",
      "fr.jpeg",
      "corb.jpeg",
      "tal.jpeg",
      "berl.jpeg",
      "Water.jpeg",
      "louis.jpeg"
    ];



    let topIndex = 0;
    let middleIndex = 0;
    let bottomIndex = 0;



    /* =========================
       RANDOM IMAGE INDEX
       ========================= */

    function getRandomIndex() {

      return Math.floor(
        Math.random() * mixerPhotos.length
      );

    }



    /* =========================
       RANDOM STARTING IMAGES
       ========================= */

    function randomizeStartingImages() {


      topIndex = getRandomIndex();


      /*
        Keep choosing until the
        middle is different from
        the top.
      */

      do {

        middleIndex = getRandomIndex();

      } while (
        middleIndex === topIndex
      );



      /*
        Keep choosing until the
        bottom is different from
        BOTH top and middle.
      */

      do {

        bottomIndex = getRandomIndex();

      } while (
        bottomIndex === topIndex ||
        bottomIndex === middleIndex
      );


      updateMixerImages();

    }



    /* =========================
       UPDATE THE THREE SLICES
       ========================= */

    function updateMixerImages() {


      document
        .getElementById("topImage")
        .src =
        mixerPhotos[topIndex];


      document
        .getElementById("middleImage")
        .src =
        mixerPhotos[middleIndex];


      document
        .getElementById("bottomImage")
        .src =
        mixerPhotos[bottomIndex];

    }



    /* =========================
       ARROWS
       ========================= */

    function changeSlice(
      section,
      direction
    ) {


      if (section === "top") {

        topIndex =
          (
            topIndex +
            direction +
            mixerPhotos.length
          ) %
          mixerPhotos.length;

      }



      if (section === "middle") {

        middleIndex =
          (
            middleIndex +
            direction +
            mixerPhotos.length
          ) %
          mixerPhotos.length;

      }



      if (section === "bottom") {

        bottomIndex =
          (
            bottomIndex +
            direction +
            mixerPhotos.length
          ) %
          mixerPhotos.length;

      }


      updateMixerImages();

    }



    /* =========================
       RANDOMIZE IMMEDIATELY
       ========================= */

    randomizeStartingImages();



    /* =========================
       ENTER SITE
       ========================= */

    let siteEntered = false;



    function enterSite() {


      if (siteEntered) {

        return;

      }


      siteEntered = true;


      const welcomeScreen =
        document.getElementById(
          "welcomeScreen"
        );


      welcomeScreen.style.opacity =
        "0";



      setTimeout(
        function() {

          document.body.classList.add(
            "site-on"
          );

        },
        650
      );



      setTimeout(
        function() {

          welcomeScreen.style.display =
            "none";

        },
        1450
      );



      setTimeout(
        function() {

          document.body.classList.add(
            "boot-complete"
          );

        },
        7200
      );

    }


  </script>
