<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>the bubsite</title>

  <style>

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      background: black;
      font-family: monospace;
    }



    /* =========================
       MAIN PAGE
       ========================= */

    .page {
      width: 100%;
      height: 100vh;
      box-sizing: border-box;
      padding: 18px 5vw 18px;

      display: flex;
      flex-direction: column;

      overflow: hidden;

      background: white;

      opacity: 0.08;
      filter: brightness(0.12);

      transition:
        opacity 1.8s ease,
        filter 2.2s ease;
    }



    body.site-on .page {
      animation: pagePowerOn 5.5s ease forwards;
    }



    @keyframes pagePowerOn {

      0% {
        opacity: 0.08;
        filter: brightness(0.10);
      }

      18% {
        opacity: 0.13;
        filter: brightness(0.15);
      }

      30% {
        opacity: 0.09;
        filter: brightness(0.10);
      }

      45% {
        opacity: 0.30;
        filter: brightness(0.35);
      }

      60% {
        opacity: 0.48;
        filter: brightness(0.52);
      }

      75% {
        opacity: 0.72;
        filter: brightness(0.75);
      }

      100% {
        opacity: 1;
        filter: brightness(1);
      }

    }



    .main-title {
      text-align: center;
      margin: 0 0 15px 0;
      font-size: clamp(34px, 4vw, 58px);
      line-height: 1;
      color: black;
      flex-shrink: 0;
    }



    .main-layout {
      width: 100%;
      max-width: 1300px;
      margin: 0 auto;

      flex: 1;
      min-height: 0;

      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 40px;
    }



    /* =========================
       LEFT SIDE
       ========================= */

    .left-column {
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }



    .photo-carousel {
      height: 180px;
      flex-shrink: 0;

      border: 4px solid black;
      box-sizing: border-box;
      background: white;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: clamp(20px, 3vw, 32px);
    }



    .map-section {
      width: 100%;
      flex: 1;
      min-height: 0;

      display: flex;
      flex-direction: column;
    }



    .map-title {
      margin: 0 0 7px 0;
      text-align: center;
      font-family: monospace;
      font-size: clamp(18px, 2vw, 28px);
      font-weight: normal;
      color: black;
      flex-shrink: 0;
    }



    .map-box {
      width: 100%;
      flex: 1;
      min-height: 0;

      border: 4px solid black;
      box-sizing: border-box;
      background: white;
      display: block;
    }



    /* =========================
       RIGHT SIDE
       ========================= */

    .right-column {
      min-height: 0;
      height: 100%;

      display: flex;
      flex-direction: column;
      gap: 10px;
    }



    /* The social links grow/shrink so
       Bub FM stays aligned to the map bottom */

    .social-link {
      display: block;
      text-decoration: none;
      flex: 1 1 0;
      min-height: 0;
    }



    .social-button {
      width: 100%;
      height: 100%;

      padding: 0 16px;

      border: 4px solid black;
      background: white;
      color: black;

      font-family: monospace;
      font-size: clamp(18px, 1.8vw, 25px);

      cursor: pointer;
      box-sizing: border-box;
      transition: 0.2s;

      display: flex;
      align-items: center;
      justify-content: center;
    }



    .social-button:hover {
      background: black;
      color: white;
    }



    /* =========================
       RADIO SECTION
       ========================= */

    .radio-section {
      width: 100%;
      flex: 0 0 auto;

      display: flex;
      flex-direction: column;
    }



    .radio-title {
      margin: 0 0 7px 0;
      text-align: center;
      font-family: monospace;
      font-size: clamp(18px, 2vw, 28px);
      font-weight: normal;
      color: black;
      flex-shrink: 0;
    }



    /* IMPORTANT:
       no outer border here.
       let cdplayer.html handle its own border */
    .cd-player-frame {
      width: 100%;
      height: 285px;

      border: none;
      box-sizing: border-box;

      margin: 0;
      display: block;
      overflow: hidden;

      background: transparent;
      flex-shrink: 0;
    }



    /* =========================
       WELCOME SCREEN
       ========================= */

    #welcomeScreen {
      position: fixed;
      inset: 0;

      width: 100%;
      height: 100%;

      background: white;

      display: flex;
      flex-direction: column;

      justify-content: center;
      align-items: center;

      text-align: center;
      color: black;
      font-family: monospace;

      z-index: 9999;
      cursor: pointer;

      opacity: 1;
      transition: opacity 1.4s ease;
    }



    #welcomeScreen h1 {
      font-size: clamp(40px, 8vw, 75px);
      margin: 0;
    }



    #welcomeScreen p {
      font-size: clamp(14px, 3vw, 20px);
      margin-top: 15px;
    }



    /* =========================
       BOOT PARTS
       ========================= */

    .boot-part {
      opacity: 0;
      filter: brightness(0);
      pointer-events: none;
    }



    body.site-on .boot-photo {
      animation: flickerPhoto 2s forwards;
      animation-delay: 0.5s;
    }

    body.site-on .boot-twitter {
      animation: flickerQuick 1.35s forwards;
      animation-delay: 0.85s;
    }

    body.site-on .boot-map {
      animation: flickerMap 4.2s forwards;
      animation-delay: 0.9s;
    }

    body.site-on .boot-soundcloud {
      animation: flickerQuick 1.45s forwards;
      animation-delay: 1.05s;
    }

    body.site-on .boot-instagram {
      animation: flickerQuick 1.15s forwards;
      animation-delay: 1.35s;
    }

    body.site-on .boot-radio {
      animation: flickerMedium 2.2s forwards;
      animation-delay: 1.65s;
    }

    body.site-on .boot-letterboxd {
      animation: flickerQuick 1.2s forwards;
      animation-delay: 1.8s;
    }

    body.site-on .boot-depop {
      animation: flickerQuick 1.1s forwards;
      animation-delay: 2.15s;
    }

    body.site-on .boot-title {
      animation: flickerTitle 1.8s forwards;
      animation-delay: 3.7s;
    }



    @keyframes flickerPhoto {

      0% {
        opacity: 0;
        filter: brightness(0);
      }

      6% {
        opacity: 0.2;
        filter: brightness(0.18);
      }

      12% {
        opacity: 0;
        filter: brightness(0);
      }

      20% {
        opacity: 0.55;
        filter: brightness(0.5);
      }

      27% {
        opacity: 0.08;
        filter: brightness(0.08);
      }

      38% {
        opacity: 0.8;
        filter: brightness(0.8);
      }

      46% {
        opacity: 0.25;
        filter: brightness(0.25);
      }

      58% {
        opacity: 1;
        filter: brightness(1);
      }

      66% {
        opacity: 0.6;
        filter: brightness(0.6);
      }

      78% {
        opacity: 1;
        filter: brightness(1);
      }

      86% {
        opacity: 0.82;
        filter: brightness(0.82);
      }

      100% {
        opacity: 1;
        filter: brightness(1);
      }

    }



    @keyframes flickerQuick {

      0% {
        opacity: 0;
        filter: brightness(0);
      }

      9% {
        opacity: 0.65;
        filter: brightness(0.65);
      }

      15% {
        opacity: 0;
        filter: brightness(0);
      }

      27% {
        opacity: 0.25;
        filter: brightness(0.25);
      }

      34% {
        opacity: 0;
        filter: brightness(0);
      }

      53% {
        opacity: 0.9;
        filter: brightness(0.9);
      }

      61% {
        opacity: 0.3;
        filter: brightness(0.3);
      }

      74% {
        opacity: 1;
        filter: brightness(1);
      }

      81% {
        opacity: 0.65;
        filter: brightness(0.7);
      }

      100% {
        opacity: 1;
        filter: brightness(1);
      }

    }



    @keyframes flickerMedium {

      0% {
        opacity: 0;
        filter: brightness(0);
      }

      8% {
        opacity: 0.25;
        filter: brightness(0.2);
      }

      13% {
        opacity: 0;
        filter: brightness(0);
      }

      24% {
        opacity: 0.65;
        filter: brightness(0.6);
      }

      29% {
        opacity: 0.08;
        filter: brightness(0.05);
      }

      43% {
        opacity: 0.85;
        filter: brightness(0.85);
      }

      49% {
        opacity: 0.2;
        filter: brightness(0.2);
      }

      64% {
        opacity: 1;
        filter: brightness(1);
      }

      72% {
        opacity: 0.5;
        filter: brightness(0.55);
      }

      83% {
        opacity: 0.9;
        filter: brightness(0.9);
      }

      100% {
        opacity: 1;
        filter: brightness(1);
      }

    }



    @keyframes flickerMap {

      0% {
        opacity: 0;
        filter: brightness(0);
      }

      7% {
        opacity: 0.1;
        filter: brightness(0.1);
      }

      11% {
        opacity: 0;
        filter: brightness(0);
      }

      20% {
        opacity: 0.35;
        filter: brightness(0.3);
      }

      24% {
        opacity: 0;
        filter: brightness(0);
      }

      34% {
        opacity: 0.55;
        filter: brightness(0.5);
      }

      38% {
        opacity: 0.08;
        filter: brightness(0.08);
      }

      47% {
        opacity: 0.75;
        filter: brightness(0.7);
      }

      51% {
        opacity: 0.18;
        filter: brightness(0.15);
      }

      61% {
        opacity: 0.9;
        filter: brightness(0.9);
      }

      66% {
        opacity: 0.4;
        filter: brightness(0.45);
      }

      75% {
        opacity: 1;
        filter: brightness(1);
      }

      80% {
        opacity: 0.65;
        filter: brightness(0.7);
      }

      88% {
        opacity: 0.95;
        filter: brightness(0.95);
      }

      92% {
        opacity: 0.8;
        filter: brightness(0.8);
      }

      100% {
        opacity: 1;
        filter: brightness(1);
      }

    }



    @keyframes flickerTitle {

      0% {
        opacity: 0;
        filter: brightness(0);
      }

      15% {
        opacity: 0.8;
        filter: brightness(0.8);
      }

      22% {
        opacity: 0;
        filter: brightness(0);
      }

      39% {
        opacity: 1;
        filter: brightness(1);
      }

      46% {
        opacity: 0.25;
        filter: brightness(0.25);
      }

      63% {
        opacity: 1;
        filter: brightness(1);
      }

      71% {
        opacity: 0.75;
        filter: brightness(0.75);
      }

      100% {
        opacity: 1;
        filter: brightness(1);
      }

    }



    body.boot-complete .boot-part {
      opacity: 1;
      filter: brightness(1);
      pointer-events: auto;
    }



    /* =========================
       MOBILE / TABLET
       ========================= */

    @media (max-width: 1000px) {

      html,
      body {
        height: auto;
        min-height: 100%;
        overflow-x: hidden;
        overflow-y: auto;
      }

      body {
        display: block;
      }

      .page {
        width: 100%;
        height: auto;
        min-height: 100vh;
        padding: 12px;
        overflow: visible;
      }

      .main-title {
        font-size: 34px;
        margin-bottom: 14px;
      }

      .main-layout {
        display: flex;
        flex-direction: column;
        width: 100%;
        max-width: none;
        gap: 14px;
      }

      .left-column,
      .right-column {
        display: contents;
      }

      .photo-carousel {
        order: 1;
        width: 100%;
        height: 180px;
        flex: none;
        font-size: 22px;
      }

      .social-link {
        order: 2;
        width: 100%;
        flex: none;
      }

      .social-button {
        width: 100%;
        height: auto;
        min-height: 72px;
        padding: 14px 10px;
        font-size: 17px;
        border-width: 3px;
      }

      .map-section {
        order: 3;
        width: 100%;
        flex: none;
      }

      .map-title {
        font-size: 18px;
        margin: 5px 0 7px;
      }

      .map-box {
        width: 100%;
        height: 420px;
        min-height: 420px;
        flex: none;
        border-width: 3px;
      }

      .radio-section {
        order: 4;
        width: 100%;
        flex: none;
      }

      .radio-title {
        font-size: 18px;
        margin: 5px 0 7px;
      }

      .cd-player-frame {
        width: 100%;
        height: 285px;
        flex: none;
      }

    }



    @media (max-width: 600px) {

      .main-title {
        font-size: 28px;
      }

      .photo-carousel {
        height: 150px;
        font-size: 18px;
      }

      .map-box {
        height: 330px;
        min-height: 330px;
      }

      .cd-player-frame {
        height: 285px;
      }

    }

  </style>

</head>



<body>



  <div
    id="welcomeScreen"
    onclick="enterSite()"
  >

    <h1>
      welcome to the bubsite
    </h1>

    <img
      src="Figure.JPG"
      alt=""
    >

    <p>
      click to enter
    </p>

  </div>



  <div class="page">



    <h1 class="main-title boot-part boot-title">
      goin abub & beyond
    </h1>



    <div class="main-layout">



      <!-- LEFT -->

      <div class="left-column">



        <div class="photo-carousel boot-part boot-photo">
          photo carousel
        </div>



        <div class="map-section boot-part boot-map">

          <h2 class="map-title">
            countries bubsier has been inside of
          </h2>

          <iframe
            src="map.html"
            class="map-box"
            title="countries bubsier has been inside of">
          </iframe>

        </div>



      </div>



      <!-- RIGHT -->

      <div class="right-column">



        <a
          href="https://www.instagram.com/bubsier/"
          class="social-link boot-part boot-instagram"
          target="_blank"
          rel="noopener noreferrer"
        >
          <button class="social-button">
            instagram
          </button>
        </a>



        <a
          href="https://x.com/bubsier04"
          class="social-link boot-part boot-twitter"
          target="_blank"
          rel="noopener noreferrer"
        >
          <button class="social-button">
            twitter
          </button>
        </a>



        <a
          href="https://letterboxd.com/bubsier/"
          class="social-link boot-part boot-letterboxd"
          target="_blank"
          rel="noopener noreferrer"
        >
          <button class="social-button">
            letterboxd
          </button>
        </a>



        <a
          href="https://on.soundcloud.com/2V1HensI3C7dCce56i"
          class="social-link boot-part boot-soundcloud"
          target="_blank"
          rel="noopener noreferrer"
        >
          <button class="social-button">
            soundcloud
          </button>
        </a>



        <a
          href="#"
          class="social-link boot-part boot-depop"
        >
          <button class="social-button">
            depop
          </button>
        </a>



        <div class="radio-section boot-part boot-radio">

          <h2 class="radio-title">
            bub fm
          </h2>

          <iframe
            src="cdplayer.html"
            class="cd-player-frame"
            scrolling="no"
            title="Bub FM">
          </iframe>

        </div>



      </div>



    </div>



  </div>



  <script>

    let siteEntered = false;

    function enterSite() {

      if (siteEntered) {
        return;
      }

      siteEntered = true;

      const welcomeScreen =
        document.getElementById("welcomeScreen");

      welcomeScreen.style.opacity = "0";

      setTimeout(function () {
        document.body.classList.add("site-on");
      }, 650);

      setTimeout(function () {
        welcomeScreen.style.display = "none";
      }, 1450);

      setTimeout(function () {
        document.body.classList.add("boot-complete");
      }, 7200);

    }

  </script>



</body>

</html>
